# Weekly index refresh: Scryfall oracle_cards -> HF dataset kasper-cbx/mtg-search-index.
#
# Required repository secret:
#   HF_TOKEN  - Hugging Face token (user kasper-cbx) with WRITE access to the dataset
#               kasper-cbx/mtg-search-index and permission to run HF Jobs (paid account; a
#               fine-grained token needs the 'Jobs' permission, or re-encode weeks stop before uploading).
#               Settings -> Secrets and variables -> Actions -> New repository secret.
#
# Tiers (scripts/refresh.py --dry-run exit code; see scripts/README.md):
#   0  up to date: Scryfall updated_at unchanged, or only volatile fields (prices, EDHREC
#      rank, printing metadata) changed -> nothing is uploaded or tagged.
#   10 metadata-only: gameplay fields (legalities/bans, tags, rulings, ...) changed but no
#      doc_text -> upload tables + manifest and tag; no HF encode job, no eval smoke.
#   11 re-encode: doc_text changed or cards added/removed -> full pipeline: one t4-small
#      HF Job (~5 min of GPU) + eval smoke on the runner's CPU (~10 min).
# The dry run already downloads and ingests into data/; the refresh step reuses it.
name: refresh-index

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the HF dataset is up to date"
        type: boolean
        default: false
      skip_eval:
        description: "Skip the eval smoke test"
        type: boolean
        default: false

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Determine refresh tier (dry run)
        id: check
        run: |
          set +e
          uv run python scripts/refresh.py --dry-run
          code=$?
          set -e
          case "$code" in
            0)  echo "tier=none" >> "$GITHUB_OUTPUT" ;;
            10) echo "tier=metadata" >> "$GITHUB_OUTPUT" ;;
            11) echo "tier=reencode" >> "$GITHUB_OUTPUT" ;;
            *)  exit "$code" ;;
          esac

      - name: Refresh (${{ steps.check.outputs.tier }})
        if: steps.check.outputs.tier != 'none' || inputs.force
        run: |
          uv run python scripts/refresh.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.skip_eval && '--skip-eval' || '' }}

    outputs:
      tier: ${{ steps.check.outputs.tier }}

  # After a refresh that tagged a new snapshot: point the package at it (bumping the patch version), commit,
  # and dispatch publish.yml, which releases it to PyPI and pushes the matching Docker image. A push made
  # with GITHUB_TOKEN does not trigger other workflows; a workflow_dispatch does.
  release:
    needs: refresh
    if: needs.refresh.outputs.tier != 'none' || inputs.force
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Point the package at the newest snapshot
        id: bump
        run: |
          set +e
          version=$(uv run python scripts/bump_index.py --latest)
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "bumped=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$code" = 0 ] || exit "$code"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and publish
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.bump.outputs.version }}: index snapshot $(PYTHONPATH=src python3 -c 'from mtg_search import config; print(config.INDEX_REVISION)')"
          git push
          gh workflow run publish.yml --ref main
