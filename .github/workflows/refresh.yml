# Weekly index refresh: Scryfall oracle_cards -> HF dataset kasper-cbx/mtg-search-index.
#
# Required repository secret:
#   HF_TOKEN  - Hugging Face token (user kasper-cbx) with WRITE access to the dataset
#               kasper-cbx/mtg-search-index and permission to run HF Jobs (paid account).
#               Settings -> Secrets and variables -> Actions -> New repository secret.
#
# Tiers (scripts/refresh.py --dry-run exit code; see scripts/README.md):
#   0  up to date: Scryfall updated_at unchanged, or only volatile fields (prices, EDHREC
#      rank, printing metadata) changed -> nothing is uploaded or tagged.
#   10 metadata-only: gameplay fields (legalities/bans, tags, rulings, ...) changed but no
#      doc_text -> upload tables + manifest and tag; no HF encode job, no eval smoke.
#   11 re-encode: doc_text changed or cards added/removed -> full pipeline: one t4-small
#      HF Job (~5 min of GPU) + eval smoke on the runner's CPU (`models` extra, ~10 min).
# The dry run already downloads and ingests into data/; the refresh step reuses it.
name: refresh-index

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the HF dataset is up to date"
        type: boolean
        default: false
      skip_eval:
        description: "Skip the eval smoke test"
        type: boolean
        default: false

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Determine refresh tier (dry run)
        id: check
        run: |
          set +e
          uv run python scripts/refresh.py --dry-run
          code=$?
          set -e
          case "$code" in
            0)  echo "tier=none" >> "$GITHUB_OUTPUT" ;;
            10) echo "tier=metadata" >> "$GITHUB_OUTPUT" ;;
            11) echo "tier=reencode" >> "$GITHUB_OUTPUT" ;;
            *)  exit "$code" ;;
          esac

      - name: Refresh (${{ steps.check.outputs.tier }})
        if: steps.check.outputs.tier != 'none' || inputs.force
        run: |
          uv run python scripts/refresh.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.skip_eval && '--skip-eval' || '' }}

    outputs:
      tier: ${{ steps.check.outputs.tier }}

  # Optional: build and push the Docker image after a refresh (both metadata-only and
  # re-encode refreshes need a new image: it bakes cards.parquet). docker/build.sh is
  # maintained separately; enable once a registry (e.g. ghcr.io) is chosen.
