[project]
name = "mtg-search"
version = "0.1.0"
description = "Semantic search over Magic: The Gathering cards, exposed as an MCP server"
readme = "PLAN.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "mcp>=2.3,<3",
    # exact backend query encoder (EXP-012)
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
]

[project.optional-dependencies]
# Query-side model stack (CPU). Install with `uv sync --extra models`.
models = [
    "torch>=2.6",
    "sentence-transformers>=6.1",
    "transformers>=5.5",
    "bm25s>=0.2.13",
    "PyStemmer>=2.2",
    "scipy>=1.13",
    # embeddinggemma-2's processor imports PIL + torchvision even for text-only use
    "pillow>=10",
    "torchvision>=0.21",
]

[project.scripts]
mtg-search-mcp = "mtg_search.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "models: tests that download/run ML models (deselect with -m 'not models')",
    "docker: tests that run the built mtg-search image (uv run pytest -m docker)",
]
addopts = "-m 'not models and not docker'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
