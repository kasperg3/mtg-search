[project]
name = "mtg-search-mcp"
dynamic = ["version"]
description = "Semantic search over every Magic: The Gathering card, as an MCP server for deck-building agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kasper Rømer Grøntved", email = "kaspergrontved@proton.me" }]
keywords = ["mcp", "mcp-server", "magic-the-gathering", "mtg", "commander", "semantic-search", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "mcp>=2.3,<3",
    # mLateOn query encoder (fp32 ONNX) for search (mlateon.py)
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
]

[project.urls]
Homepage = "https://github.com/kasperg3/mtg-search"
Write-up = "https://www.grontved.xyz/blog/agent-search-vs-grep/"
Datasets = "https://huggingface.co/kasper-cbx"
Issues = "https://github.com/kasperg3/mtg-search/issues"

[project.scripts]
mtg-search-mcp = "mtg_search.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mtg_search/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_search"]

[tool.hatch.build.targets.sdist]
include = ["/src/mtg_search", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "docker: tests that run the built mtg-search image (uv run pytest -m docker)",
]
addopts = "-m 'not docker'"
