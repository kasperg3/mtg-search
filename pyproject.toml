[project]
name = "mtg-search"
version = "0.1.0"
description = "Semantic search over Magic: The Gathering cards, exposed as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "mcp>=2.3,<3",
    # mLateOn query encoder (fp32 ONNX) for search (mlateon.py)
    "onnxruntime>=1.30",
    "tokenizers>=0.23",
]

[project.scripts]
mtg-search-mcp = "mtg_search.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "docker: tests that run the built mtg-search image (uv run pytest -m docker)",
]
addopts = "-m 'not docker'"
